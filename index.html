<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SAY TABLE PRO v1.0</title>

<style>

:root{

--bg:#0f172a;
--card:#1e293b;
--text:#f8fafc;
--border:#334155;
--primary:#06b6d4;
--success:#10b981;
--danger:#ef4444;
--warning:#f59e0b;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
height:100vh;
display:flex;
flex-direction:column;
}

header{

height:65px;

display:flex;
justify-content:space-between;
align-items:center;

padding:0 15px;

background:#020617;

border-bottom:1px solid var(--border);

}

.logo{
font-size:22px;
font-weight:900;
color:var(--primary);
}

.toolbar{

display:flex;
gap:8px;
padding:10px;

background:#111827;

flex-wrap:wrap;

border-bottom:1px solid var(--border);

}

button{

padding:10px 14px;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:bold;

}

.btn-green{
background:var(--success);
color:white;
}

.btn-red{
background:var(--danger);
color:white;
}

.btn-blue{
background:var(--primary);
color:white;
}

#searchBox{

padding:10px;
width:250px;

border:none;

border-radius:10px;

}

.table-wrap{

flex:1;

overflow:auto;

padding:10px;

}

table{

border-collapse:collapse;

min-width:1000px;

background:var(--card);

}

th{

position:sticky;

top:0;

z-index:100;

background:#1e293b;

}

th:first-child,
td:first-child{

position:sticky;

right:0;

z-index:90;

background:#1e293b;

}

th,
td{

border:1px solid var(--border);

padding:10px;

text-align:center;

min-width:120px;

height:50px;

}

td{

cursor:pointer;

}

td:hover{

background:#334155;

}

</style>
</head>
<body>

<header>
<div class="logo">SAY TABLE PRO</div>
<div>🔥 Build 001</div>
</header>

<div class="toolbar">

<button class="btn-green" id="addRowBtn">
➕ صف
</button>

<button class="btn-green" id="addColBtn">
➕ عمود
</button>

<button class="btn-red" id="removeRowBtn">
🗑 صف
</button>

<button class="btn-red" id="removeColBtn">
🗑 عمود
</button>

<input
type="text"
id="searchBox"
placeholder="🔍 بحث..."
>

</div>

<div class="table-wrap">
<table id="table"></table>
</div>

<script>

// سيتم هنا وضع JavaScript الخاص بالجدول

</script>

</body>
</html>
