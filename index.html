<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SAY TABLE PRO v1.0</title>

<style>

:root{

--bg:#0f172a;
--card:#1e293b;
--text:#f8fafc;
--border:#334155;
--primary:#06b6d4;
--success:#10b981;
--danger:#ef4444;
--warning:#f59e0b;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
height:100vh;
display:flex;
flex-direction:column;
}

header{

height:65px;

display:flex;
justify-content:space-between;
align-items:center;

padding:0 15px;

background:#020617;

border-bottom:1px solid var(--border);

}

.logo{
font-size:22px;
font-weight:900;
color:var(--primary);
}

.toolbar{

display:flex;
gap:8px;
padding:10px;

background:#111827;

flex-wrap:wrap;

border-bottom:1px solid var(--border);

}

button{

padding:10px 14px;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:bold;

}

.btn-green{
background:var(--success);
color:white;
}

.btn-red{
background:var(--danger);
color:white;
}

.btn-blue{
background:var(--primary);
color:white;
}

.btn-orange{
background:var(--warning);
color:white;
}

#searchBox{

padding:10px;
width:250px;

border:none;

border-radius:10px;

}

.table-wrap{

flex:1;

overflow:auto;

padding:10px;

}

table{

border-collapse:collapse;

min-width:1000px;

background:var(--card);

}

th{

position:sticky;

top:0;

z-index:100;

background:#1e293b;

}

th:first-child,
td:first-child{

position:sticky;

right:0;

z-index:90;

background:#1e293b;

}

th,
td{

border:1px solid var(--border);

padding:10px;

text-align:center;

min-width:120px;

height:50px;

}

td{

cursor:pointer;

}

td:hover{

background:#334155;

}

.rating{
color:#facc15;
font-size:18px;
}

.true{
color:#10b981;
font-size:20px;
}

.false{
color:#ef4444;
font-size:20px;
}

.modal{

position:fixed;

inset:0;

background:rgba(0,0,0,.5);

display:none;

justify-content:center;

align-items:center;

}

.modal-content{

width:400px;

background:#1e293b;

padding:20px;

border-radius:15px;

}

.modal-content input,
.modal-content select{

width:100%;

padding:10px;

margin-top:10px;

}

</style>
</head>

<body>

<header>

<div class="logo">

SAY TABLE PRO

</div>

<div>

🔥 Build 001

</div>

</header>

<div class="toolbar">

<button class="btn-green" id="addRowBtn">
➕ صف
</button>

<button class="btn-green" id="addColBtn">
➕ عمود
</button>

<button class="btn-red" id="removeRowBtn">
🗑 صف
</button>

<button class="btn-red" id="removeColBtn">
🗑 عمود
</button>

<button class="btn-blue">
📥 استيراد
</button>

<button class="btn-blue">
📤 تصدير
</button>

<input
type="text"
id="searchBox"
placeholder="🔍 بحث..."
>

</div>

<div class="table-wrap">

<table id="table"></table>

</div>

<div id="editor" class="modal">

<div class="modal-content">

<h3>تحرير الخلية</h3>

<select id="cellType">

<option value="text">📄 نص</option>

<option value="number">🔢 رقم</option>

<option value="date">📅 تاريخ</option>

<option value="rating">⭐ تقييم</option>

<option value="boolean">✅❌ صح او خطأ</option>

<option value="calculator">🧮 حاسبة</option>

</select>

<input
type="text"
id="cellValue"
placeholder="القيمة"
>

<button
class="btn-green"
id="saveCell"
style="width:100%;margin-top:10px;"
>
حفظ
</button>

</div>

</div>

<script>

let rows=10;
let cols=5;

let selectedRow=0;
let selectedCol=0;

let data=[];

function init(){

data=[];

for(let r=0;r<rows;r++){

let row=[];

for(let c=0;c<cols;c++){

row.push({

type:'text',

value:''

});

}

data.push(row);

}

render();

}

function render(){

const table=document.getElementById('table');

table.innerHTML='';

let head='<tr><th>#</th>';

for(let c=0;c<cols;c++){

head+=`<th>${String.fromCharCode(65+c)}</th>`;

}

head+='</tr>';

table.innerHTML+=head;

for(let r=0;r<rows;r++){

let tr=`<tr><th>${r+1}</th>`;

for(let c=0;c<cols;c++){

let cell=data[r][c];

let display='';

if(cell.type==='rating'){

display='⭐'.repeat(cell.value||0);

}

else if(cell.type==='boolean'){

display=cell.value==='true'
?'✅'
:'❌';

}

else if(cell.type==='calculator'){

display=cell.value;

}

else{

display=cell.value;

}

tr+=`
<td onclick="editCell(${r},${c})">
${display}
</td>
`;

}

tr+='</tr>';

table.innerHTML+=tr;

}

localStorage.setItem(
'say-table-pro',
JSON.stringify(data)
);

}

function editCell(r,c){

selectedRow=r;
selectedCol=c;

document.getElementById('editor').style.display='flex';

let cell=data[r][c];

document.getElementById('cellType').value=cell.type;

document.getElementById('cellValue').value=cell.value;

}

document.getElementById('saveCell')
.addEventListener('click',()=>{

let type=
document.getElementById('cellType').value;

let value=
document.getElementById('cellValue').value;

if(type==='calculator'){

try{

const result=eval(value);

value=value+' = '+result;

}
catch{

value='خطأ';

}

}

data[selectedRow][selectedCol]={

type,
value

};

render();

document.getElementById('editor')
.style.display='none';

});

document.getElementById('addRowBtn')
.addEventListener('click',()=>{

rows++;

data.push(
Array(cols)
.fill()
.map(()=>({
type:'text',
value:''
}))
);

render();

});

document.getElementById('addColBtn')
.addEventListener('click',()=>{

cols++;

data.forEach(row=>{

row.push({
type:'text',
value:''
});

});

render();

});

document.getElementById('removeRowBtn')
.addEventListener('click',()=>{

if(rows>1){

rows--;

data.pop();

render();

}

});

document.getElementById('removeColBtn')
.addEventListener('click',()=>{

if(cols>1){

cols--;

data.forEach(
row=>row.pop()
);

render();

}

});

init();

</script>

</body>
</html>
